<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .box { rx: 8; stroke-width: 1.5; }
      .box-wan { fill: #1e293b; stroke: #38bdf8; }
      .box-dc1 { fill: #1e293b; stroke: #818cf8; }
      .box-dc2 { fill: #1e293b; stroke: #34d399; }
      .node { rx: 6; stroke-width: 1.5; }
      .node-router { fill: #334155; stroke: #94a3b8; }
      .node-host { fill: #1e3a5f; stroke: #60a5fa; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #94a3b8; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #ffffff; text-anchor: middle; }
      .node-sub { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #cbd5e1; text-anchor: middle; }
      .link { stroke-width: 2; fill: none; }
      .link-wan { stroke: #38bdf8; stroke-dasharray: 6 3; }
      .link-int { stroke: #94a3b8; }
      .lbl { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #94a3b8; text-anchor: middle; }
      .lbl-bold { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 600; fill: #38bdf8; text-anchor: middle; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" class="bg" rx="12" />

  <!-- WAN Core Subgraph -->
  <rect x="360" y="30" width="240" height="120" class="box box-wan" />
  <text x="380" y="55" class="title">WAN CORE PROVIDER</text>
  <text x="380" y="70" class="subtitle">Autonomous System: AS 65000</text>
  
  <rect x="410" y="80" width="140" height="52" class="node node-router" />
  <text x="480" y="102" class="node-title">wan-r1</text>
  <text x="480" y="118" class="node-sub">10.255.255.1</text>

  <!-- DC1 Subgraph -->
  <rect x="40" y="220" width="410" height="260" class="box box-dc1" />
  <text x="60" y="245" class="title">DATA CENTER 1 (DC-ALPHA)</text>
  <text x="60" y="260" class="subtitle">Autonomous System: AS 65100 | IGP: OSPF Area 0</text>

  <rect x="290" y="280" width="130" height="50" class="node node-router" />
  <text x="355" y="302" class="node-title">dc1-edge</text>
  <text x="355" y="318" class="node-sub">AS 65100</text>

  <rect x="290" y="400" width="130" height="50" class="node node-router" />
  <text x="355" y="422" class="node-title">dc1-dist</text>
  <text x="355" y="438" class="node-sub">OSPF Area 0</text>

  <rect x="70" y="400" width="140" height="50" class="node node-host" />
  <text x="140" y="422" class="node-title">dc1-srv</text>
  <text x="140" y="438" class="node-sub">10.1.10.100/24</text>

  <!-- DC2 Subgraph -->
  <rect x="510" y="220" width="410" height="260" class="box box-dc2" />
  <text x="530" y="245" class="title">DATA CENTER 2 (DC-BRAVO)</text>
  <text x="530" y="260" class="subtitle">Autonomous System: AS 65200 | IGP: OSPF Area 0</text>

  <rect x="540" y="280" width="130" height="50" class="node node-router" />
  <text x="605" y="302" class="node-title">dc2-edge</text>
  <text x="605" y="318" class="node-sub">AS 65200</text>

  <rect x="540" y="400" width="130" height="50" class="node node-router" />
  <text x="605" y="422" class="node-title">dc2-dist</text>
  <text x="605" y="438" class="node-sub">OSPF Area 0</text>

  <rect x="750" y="400" width="140" height="50" class="node node-host" />
  <text x="820" y="422" class="node-title">dc2-srv</text>
  <text x="820" y="438" class="node-sub">10.2.10.100/24</text>

  <!-- Connections -->
  <!-- WAN to DC1 -->
  <path d="M 440 132 L 355 280" class="link link-wan" />
  <text x="365" y="195" class="lbl-bold">eBGP Peering</text>
  <text x="365" y="210" class="lbl">10.100.1.0/30</text>

  <!-- WAN to DC2 -->
  <path d="M 520 132 L 605 280" class="link link-wan" />
  <text x="595" y="195" class="lbl-bold">eBGP Peering</text>
  <text x="595" y="210" class="lbl">10.100.2.0/30</text>

  <!-- DC1 Internal -->
  <path d="M 355 330 L 355 400" class="link link-int" />
  <text x="395" y="365" class="lbl">10.1.0.0/30 (p2p)</text>

  <path d="M 290 425 L 210 425" class="link link-int" />
  <text x="250" y="415" class="lbl">10.1.10.0/24</text>

  <!-- DC2 Internal -->
  <path d="M 605 330 L 605 400" class="link link-int" />
  <text x="645" y="365" class="lbl">10.2.0.0/30 (p2p)</text>

  <path d="M 670 425 L 750 425" class="link link-int" />
  <text x="710" y="415" class="lbl">10.2.10.0/24</text>

</svg>
