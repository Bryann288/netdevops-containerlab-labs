<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b1120; }
      .box { rx: 10; stroke-width: 1.5; }
      .box-wan { fill: #0f172a; stroke: #38bdf8; }
      .box-dc1 { fill: #0f172a; stroke: #6366f1; }
      .box-dc2 { fill: #0f172a; stroke: #10b981; }
      .node-box { rx: 8; stroke-width: 1.5; }
      .router-box { fill: #1e293b; stroke: #475569; }
      .host-box { fill: #1e293b; stroke: #3b82f6; }
      .title-wan { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #38bdf8; letter-spacing: 0.5px; }
      .title-dc1 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #818cf8; letter-spacing: 0.5px; }
      .title-dc2 { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #34d399; letter-spacing: 0.5px; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #94a3b8; }
      .node-name { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; text-anchor: middle; }
      .node-detail { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; fill: #94a3b8; text-anchor: middle; }
      .link-wan { stroke: #38bdf8; stroke-width: 2.5; stroke-dasharray: 6 4; }
      .link-lan { stroke: #64748b; stroke-width: 2; }
      .tag-bg { fill: #1e293b; rx: 4; stroke: #334155; stroke-width: 1; }
      .tag-text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 10px; font-weight: 600; fill: #38bdf8; text-anchor: middle; }
      .tag-sub { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9.5px; fill: #cbd5e1; text-anchor: middle; }
      .port-tag { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 9px; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="540" class="bg" rx="12" />

  <!-- WAN Core Subgraph -->
  <rect x="360" y="24" width="280" height="120" class="box box-wan" />
  <text x="380" y="48" class="title-wan">WAN CORE PROVIDER</text>
  <text x="380" y="65" class="subtitle">Transit Network - AS 65000</text>
  
  <rect x="425" y="78" width="150" height="50" class="node-box router-box" />
  <text x="500" y="99" class="node-name">wan-r1</text>
  <text x="500" y="115" class="node-detail">10.255.255.1</text>

  <!-- DC1 Subgraph -->
  <rect x="40" y="200" width="430" height="300" class="box box-dc1" />
  <text x="65" y="228" class="title-dc1">DATA CENTER 1 (ALPHA)</text>
  <text x="65" y="244" class="subtitle">Autonomous System: AS 65100 | IGP: OSPF Area 0</text>

  <!-- dc1-edge -->
  <rect x="290" y="265" width="150" height="52" class="node-box router-box" />
  <text x="365" y="287" class="node-name">dc1-edge</text>
  <text x="365" y="303" class="node-detail">AS 65100 / OSPF</text>

  <!-- dc1-dist -->
  <rect x="290" y="415" width="150" height="52" class="node-box router-box" />
  <text x="365" y="437" class="node-name">dc1-dist</text>
  <text x="365" y="453" class="node-detail">OSPF Area 0</text>

  <!-- dc1-srv -->
  <rect x="65" y="415" width="160" height="52" class="node-box host-box" />
  <text x="145" y="437" class="node-name">dc1-srv</text>
  <text x="145" y="453" class="node-detail">10.1.10.100/24</text>

  <!-- DC2 Subgraph -->
  <rect x="530" y="200" width="430" height="300" class="box box-dc2" />
  <text x="555" y="228" class="title-dc2">DATA CENTER 2 (BRAVO)</text>
  <text x="555" y="244" class="subtitle">Autonomous System: AS 65200 | IGP: OSPF Area 0</text>

  <!-- dc2-edge -->
  <rect x="560" y="265" width="150" height="52" class="node-box router-box" />
  <text x="635" y="287" class="node-name">dc2-edge</text>
  <text x="635" y="303" class="node-detail">AS 65200 / OSPF</text>

  <!-- dc2-dist -->
  <rect x="560" y="415" width="150" height="52" class="node-box router-box" />
  <text x="635" y="437" class="node-name">dc2-dist</text>
  <text x="635" y="453" class="node-detail">OSPF Area 0</text>

  <!-- dc2-srv -->
  <rect x="775" y="415" width="160" height="52" class="node-box host-box" />
  <text x="855" y="437" class="node-name">dc2-srv</text>
  <text x="855" y="453" class="node-detail">10.2.10.100/24</text>

  <!-- Links & Connections -->
  <!-- WAN to DC1 Link -->
  <line x1="450" y1="128" x2="365" y2="265" class="link-wan" />
  <rect x="330" y="168" width="115" height="34" class="tag-bg" />
  <text x="387" y="183" class="tag-text">eBGP Link</text>
  <text x="387" y="196" class="tag-sub">10.100.1.0/30</text>
  <text x="442" y="145" class="port-tag">eth1</text>
  <text x="372" y="255" class="port-tag">eth1</text>

  <!-- WAN to DC2 Link -->
  <line x1="550" y1="128" x2="635" y2="265" class="link-wan" />
  <rect x="555" y="168" width="115" height="34" class="tag-bg" />
  <text x="612" y="183" class="tag-text">eBGP Link</text>
  <text x="612" y="196" class="tag-sub">10.100.2.0/30</text>
  <text x="548" y="145" class="port-tag">eth2</text>
  <text x="618" y="255" class="port-tag">eth1</text>

  <!-- DC1 Internal Link (Edge - Dist) -->
  <line x1="365" y1="317" x2="365" y2="415" class="link-lan" />
  <rect x="375" y="352" width="80" height="26" class="tag-bg" />
  <text x="415" y="368" class="tag-sub">10.1.0.0/30</text>
  <text x="345" y="335" class="port-tag">eth2</text>
  <text x="345" y="405" class="port-tag">eth1</text>

  <!-- DC1 Host Link (Dist - Srv) -->
  <line x1="290" y1="441" x2="225" y2="441" class="link-lan" />
  <rect x="232" y="448" width="52" height="18" class="tag-bg" />
  <text x="258" y="460" class="tag-sub">LAN</text>
  <text x="268" y="435" class="port-tag">eth2</text>
  <text x="230" y="435" class="port-tag">eth1</text>

  <!-- DC2 Internal Link (Edge - Dist) -->
  <line x1="635" y1="317" x2="635" y2="415" class="link-lan" />
  <rect x="645" y="352" width="80" height="26" class="tag-bg" />
  <text x="685" y="368" class="tag-sub">10.2.0.0/30</text>
  <text x="615" y="335" class="port-tag">eth2</text>
  <text x="615" y="405" class="port-tag">eth1</text>

  <!-- DC2 Host Link (Dist - Srv) -->
  <line x1="710" y1="441" x2="775" y2="441" class="link-lan" />
  <rect x="716" y="448" width="52" height="18" class="tag-bg" />
  <text x="742" y="460" class="tag-sub">LAN</text>
  <text x="715" y="435" class="port-tag">eth2</text>
  <text x="755" y="435" class="port-tag">eth1</text>

</svg>
