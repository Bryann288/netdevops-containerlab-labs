hostname wan-r1
log stdout
!
interface eth1
 description Link to DC1-Edge
 ip address 10.100.1.1/30
!
interface eth2
 description Link to DC2-Edge
 ip address 10.100.2.1/30
!
router bgp 65000
 bgp router-id 10.255.255.1
 no bgp ebgp-requires-policy
 neighbor 10.100.1.2 remote-as 65100
 neighbor 10.100.1.2 description DC1-Edge
 neighbor 10.100.2.2 remote-as 65200
 neighbor 10.100.2.2 description DC2-Edge
 !
 address-family ipv4 unicast
  neighbor 10.100.1.2 activate
  neighbor 10.100.2.2 activate
 exit-address-family
!
line vty
!
