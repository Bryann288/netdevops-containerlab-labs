name: srlinux-clos

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:latest

  nodes:
    spine1:
      kind: nokia_srlinux
      type: ixr-d2l
    leaf1:
      kind: nokia_srlinux
      type: ixr-d2l
    leaf2:
      kind: nokia_srlinux
      type: ixr-d2l

    client1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.1.10/24 dev eth1

    client2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.2.10/24 dev eth1

  links:
    - endpoints: ["spine1:e1-1", "leaf1:e1-1"]
    - endpoints: ["spine1:e1-2", "leaf2:e1-1"]
    - endpoints: ["leaf1:e1-2", "client1:eth1"]
    - endpoints: ["leaf2:e1-2", "client2:eth1"]
