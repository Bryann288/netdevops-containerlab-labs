name: arista-ceos

topology:
  kinds:
    arista_ceos:
      image: ceos:latest

  nodes:
    sw1:
      kind: arista_ceos
    sw2:
      kind: arista_ceos

    host1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.1.1.10/24 dev eth1

    host2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 10.1.1.20/24 dev eth1

  links:
    - endpoints: ["sw1:eth1", "sw2:eth1"]
    - endpoints: ["sw1:eth2", "host1:eth1"]
    - endpoints: ["sw2:eth2", "host2:eth1"]
