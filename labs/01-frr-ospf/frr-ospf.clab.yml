name: frr-ospf

topology:
  nodes:
    r1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - config/r1/daemons:/etc/frr/daemons
        - config/r1/frr.conf:/etc/frr/frr.conf

    r2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - config/r2/daemons:/etc/frr/daemons
        - config/r2/frr.conf:/etc/frr/frr.conf

    pc1:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.10.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.10.1

    pc2:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.20.10/24 dev eth1
        - ip route add 192.168.0.0/16 via 192.168.20.1

  links:
    - endpoints: ["r1:eth1", "r2:eth1"]
    - endpoints: ["r1:eth2", "pc1:eth1"]
    - endpoints: ["r2:eth2", "pc2:eth1"]
