hostname r2
log stdout
!
interface eth1
 description Link to R1
 ip address 10.0.0.2/30
 ip ospf area 0
!
interface eth2
 description LAN to PC2
 ip address 192.168.20.1/24
 ip ospf area 0
!
router ospf
 ospf router-id 2.2.2.2
 network 10.0.0.0/30 area 0
 network 192.168.20.0/24 area 0
!
line vty
!
