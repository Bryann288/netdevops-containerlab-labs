hostname r1
log stdout
!
interface eth1
 description Link to R2
 ip address 10.0.0.1/30
 ip ospf area 0
!
interface eth2
 description LAN to PC1
 ip address 192.168.10.1/24
 ip ospf area 0
!
router ospf
 ospf router-id 1.1.1.1
 network 10.0.0.0/30 area 0
 network 192.168.10.0/24 area 0
!
line vty
!
